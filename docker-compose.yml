services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: repos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/localhost/6333" 2>/dev/null || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  repo-service:
    build: ./services/repo-service
    ports:
      - '8001:8001'
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres/repos
      APP_URL: http://app:8000
    volumes:
      - ./services/repo-service:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    depends_on:
      postgres:
        condition: service_healthy

  coder-agent:
    build: ./services/coder-agent
    ports:
      - '8002:8002'
    env_file:
      - path: .env
        required: false
    volumes:
      - ./services/coder-agent:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8002 --reload

  app:
    build: ./services/knowledge-api
    ports:
      - '8000:8000'
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_HOST: qdrant
      REPO_SERVICE_URL: http://repo-service:8001
      CODER_AGENT_URL: http://coder-agent:8002
    volumes:
      - ./services/knowledge-api:/app
      - hf_cache:/root/.cache/huggingface
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      qdrant:
        condition: service_healthy
      repo-service:
        condition: service_started
      coder-agent:
        condition: service_started

  ui:
    build: ./services/ui
    ports:
      - '4200:80'
    volumes:
      - ./services/ui/src:/usr/share/nginx/html
    depends_on:
      - app

volumes:
  qdrant_storage:
  postgres_data:
  hf_cache:
